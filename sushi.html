<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sushi UI Responsive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* ===== BODY ===== */
body{
  background:#f5f5f5;
}

/* ===== APP CONTAINER ===== */
.app{
  max-width:95%;
  min-height:60vh;
  margin:60px auto;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  padding:20px 30px;
}
.header h1{
  flex:1;
  text-align:center;
  font-size:26px;
}
.back{
  font-size:20px;
}

/* ===== SEARCH ===== */
.search-box{
  margin:20px 30px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:14px 45px 14px 20px;
  border-radius:30px;
  border:none;
  background:#f2f2f2;
}
.search-icon{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
}

/* ===== INFO BAR ===== */
.info-bar{
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px 30px;
  flex-wrap:wrap;
}
.promo{
  background:#ffcc00;
  padding:6px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
}
.info{
  font-size:14px;
}

/* ===== LIST ===== */
.list{
  padding:20px 30px 140px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

/* ===== CARD ===== */
.card{
  position:relative;
  border-radius:18px;
  overflow:hidden;
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

/* ===== LOGOS ===== */
.logo{
  position:absolute;
  top:12px;
  left:12px;
  background:white;
  padding:6px 12px;
  border-radius:10px;
  font-weight:bold;
}
.benkay{
  background:black;
  color:white;
}
.torii{
  background:red;
  color:white;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:1400px;
  display:flex;
  justify-content:space-around;
  padding:16px 0;
  background:#f5f5f5;
  z-index:1000;
}

/* 🔥 SUPPRESSION LIGNE & COULEUR VIOLETTE */
.bottom-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:black;
  font-size:22px;
  opacity:.4;
}

.bottom-nav a:visited{
  color:black;
}

.bottom-nav a:hover{
  opacity:1;
  color:#44ca0f;
}

.bottom-nav span{
  font-size:12px;
  margin-top:4px;
}

/* ===== MOBILE ===== */
@media (max-width: 767px){

  .app{
    max-width:390px;
    margin:0 auto;
    min-height:100vh;
    border-radius:0;
  }

  .list{
    grid-template-columns:1fr;
    padding-bottom:120px;
  }

  .card img{
    height:160px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <span class="back">←</span>
    <h1>Sushi</h1>
  </header>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" placeholder="Recherche dans Golovo">
    <span class="search-icon">🔍</span>
  </div>

  <!-- INFO -->
  <div class="info-bar">
    <span class="promo">-21% sélection</span>
    <span class="info">👍 93%</span>
    <span class="info">⏱ 20-30'</span>
    <span class="info">🚚 2,000 DT</span>
  </div>

  <!-- LIST -->
  <div class="list">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=1200&q=80">
      <div class="logo">Sushi</div>
    </div>

    <div class="card">
      <img src="images/suhi.jpg">
      <div class="logo benkay">BENKAY</div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=1200&q=80">
      <div class="logo torii">TORII</div>
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="home.html">
    🏠
    <span>Home</span>
  </a>
  <a href="commande.html">
    🛒
    <span>Panier</span>
  </a>
  <a href="profil.html">
    👤
    <span>Profil</span>
  </a>
</div>

</body>
</html>
